name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check ONNX model
        run: test -s public/models/unet32.onnx

      - name: Check preset assets
        run: npm run check:preset-assets

      - name: Check image metadata
        run: npm run check:image-metadata

      - name: Build web app
        run: npm run build
        env:
          GAPFILL_INCLUDE_TASK_C: "false"

      - name: Confirm Task C is excluded from the public build
        run: |
          test ! -e dist/preset-images/C
          ! grep -R -q "coloring_full.png" dist/assets

  krita-plugin:
    name: Krita plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: krita-plugin/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r krita-plugin/requirements-dev.txt

      - name: Run tests
        working-directory: krita-plugin
        run: pytest

      - name: Run lint
        working-directory: krita-plugin
        run: ruff check .

      - name: Build importable plugin
        run: python krita-plugin/scripts/build_plugin.py

      - name: Inspect package
        run: |
          unzip -t krita-plugin/dist/gapfill-krita.zip
          unzip -l krita-plugin/dist/gapfill-krita.zip | grep -q 'gapfill_krita/resources/models/unet32.onnx'

  csp-core:
    name: CSP Gap Assist core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S csp-plugin -B csp-plugin/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build csp-plugin/build --config Release --parallel 2

      - name: Run core and PNG end-to-end tests
        run: ctest --test-dir csp-plugin/build -C Release --output-on-failure
