name: Build Krita plugin bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "krita-v*"

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.platform }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python matching Krita 5.3/6
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: krita-plugin/requirements-runtime.txt

      - name: Vendor runtime dependencies
        run: python -m pip install -r krita-plugin/requirements-runtime.txt --target krita-plugin/vendor

      - name: Build self-contained plugin
        run: python krita-plugin/scripts/build_plugin.py --vendor krita-plugin/vendor --output krita-plugin/dist/gapfill-krita-${{ matrix.platform }}.zip

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-krita-${{ matrix.platform }}
          path: krita-plugin/dist/gapfill-krita-${{ matrix.platform }}.zip
          if-no-files-found: error
